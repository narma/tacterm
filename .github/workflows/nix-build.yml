name: Nix Build
# Include the merge SHA: a changed base branch must be validated again.
run-name: '${{ github.workflow }} / ${{ github.event_name }} / ${{ github.event.pull_request.number || github.ref_name }} / ${{ github.sha }}'

on:
  workflow_dispatch:
  # PRs build the flake only when they touch what the flake consumes;
  # every merge to main still builds it against the full tree, so a
  # regression from ordinary Rust changes is caught one merge later
  # instead of charging every PR push ~10-30 min.
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'pkgRio.nix'
      - 'Cargo.lock'
      - '.github/workflows/nix-build.yml'
      - '.github/actions/ci-deduplicate/**'
      - '.github/scripts/ci-deduplicate*'
  push:
    branches:
      - main
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
      - 'pkgRio.nix'
      - '.github/workflows/nix-build.yml'
      - '.github/actions/ci-deduplicate/**'
      - '.github/scripts/ci-deduplicate*'

# Serialize duplicate deliveries so the second can reuse the first's result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Check for duplicate CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ci-deduplicate
        id: check

  lints:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Build
    strategy:
      matrix:
        # Both Linux arches so the cachix cache serves x86_64 users too,
        # not just the arm runner's own architecture.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      # Binary cache, both directions: substitutes previously-built paths
      # for CI, and flake users get rioterm.cachix.org as a substituter
      # (the flake's nixConfig offers it) so `nix run` is a download.
      # Only main builds are pushed.
      - uses: cachix/cachix-action@v17
        with:
          name: rioterm
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}
      - uses: DeterminateSystems/flake-checker-action@main
      - run: nix build --max-jobs auto --build-max-jobs auto --print-build-logs
