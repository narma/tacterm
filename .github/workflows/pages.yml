name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'FORK_STATUS.md'
      - 'Cargo.toml'
      - 'packaging/VERSION'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'FORK_STATUS.md'
      - 'Cargo.toml'
      - 'packaging/VERSION'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Read GitHub Pages configuration
        if: github.event_name != 'pull_request' && github.repository == 'narma/tacterm'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static website
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          GH_TOKEN: ${{ github.token }}
        run: bun website/build.mjs --fetch-release
      - name: Check download metadata and theme behavior
        run: bun test ./website/releases.test.mjs ./website/theme.test.mjs
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/site

  deploy:
    if: github.event_name != 'pull_request' && github.repository == 'narma/tacterm'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
