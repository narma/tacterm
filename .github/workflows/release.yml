name: Tacterm macOS x64 cold comparison
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tacterm-macos-cross-trial
  cancel-in-progress: false
jobs:
  verify:
    name: Native Intel validation of ARM-built x64 binary
    needs: cross
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 53a72cda097e4275a8df2a7347fee0a5fb322575
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: binary-arm-cross
          path: target/transfer
      - name: Extract and verify x64 architecture
        run: |-
          mkdir -p target/x86_64-apple-darwin/release
          tar -xzf target/transfer/x64-binary.tar.gz -C target/x86_64-apple-darwin/release
          test "$(uname -m)" = x86_64
          test "$(lipo -archs target/x86_64-apple-darwin/release/tacterm)" = x86_64
          shasum -a 256 target/x86_64-apple-darwin/release/tacterm
      - name: Package and smoke-test natively on Intel
        run: node --input-type=module -e "process.env.GITHUB_SHA='53a72cda097e4275a8df2a7347fee0a5fb322575'; process.argv=['node','packaging/release.mjs','pack','macos-x64']; await import('./packaging/release.mjs');"
      - uses: actions/upload-artifact@v4
        with:
          name: package-arm-cross
          path: target/release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  native:
    name: ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: intel-native
            runner: macos-15-intel
            jobs: "2"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      TACTERM_RELEASE_VERSION: 0.1.0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 53a72cda097e4275a8df2a7347fee0a5fb322575
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install identical Rust toolchain and target
        run: rustup toolchain install 1.99.1 --profile minimal --target x86_64-apple-darwin
      - name: Record host and assert cold target directory
        run: |-
          test ! -d target/x86_64-apple-darwin
          mkdir -p target/ci-memory
          { git rev-parse HEAD; uname -a; sw_vers; sysctl hw.memsize hw.ncpu; xcodebuild -version; xcrun --show-sdk-version; rustc +1.99.1 -vV; } > target/ci-memory/host.txt
      - name: Cold build with host memory sampling
        shell: bash
        env:
          BUILD_TARGET: x86_64-apple-darwin
        run: |
          mkdir -p target/ci-memory
          node --input-type=module <<'NODE'
          import os from 'node:os';
          import fs from 'node:fs';
          import { spawn, execFileSync } from 'node:child_process';
          const dir = 'target/ci-memory';
          const started = Date.now();
          let minimumFree = os.totalmem();
          let minimumAvailable = os.totalmem();
          let samples = 0;
          function snapshot() {
            const row = { seconds: (Date.now() - started) / 1000, freeBytes: os.freemem() };
            // Linux available memory includes reclaimable cache. macOS free
            // memory alone is not memory pressure: retain VM/swap counters too.
            if (process.platform === 'linux') {
              const info = fs.readFileSync('/proc/meminfo', 'utf8');
              row.meminfo = info;
              row.availableBytes = Number(/^MemAvailable:\s+(\d+)/m.exec(info)[1]) * 1024;
              minimumAvailable = Math.min(minimumAvailable, row.availableBytes);
            }
            if (process.platform === 'darwin') {
              row.vmStat = execFileSync('vm_stat', { encoding: 'utf8' });
              row.swap = execFileSync('sysctl', ['vm.swapusage'], { encoding: 'utf8' });
            }
            if (process.platform === 'win32' && samples % 5 === 0) {
              row.memoryCounters = execFileSync('powershell.exe', ['-NoProfile', '-Command',
                'Get-CimInstance Win32_PerfFormattedData_PerfOS_Memory | Select-Object AvailableBytes,CommittedBytes,CommitLimit,PagesPersec | ConvertTo-Json -Compress'],
                { encoding: 'utf8' }).trim();
            }
            minimumFree = Math.min(minimumFree, row.freeBytes);
            samples++;
            fs.appendFileSync(`${dir}/samples.jsonl`, JSON.stringify(row) + '\n');
          }
          snapshot();
          const timer = setInterval(snapshot, 2000);
          const child = spawn(process.platform === 'win32' ? 'cargo.exe' : 'cargo',
            ['+1.99.1', 'build', '--locked', '--release', '-p', 'rioterm', '--bin', 'tacterm',
             '--features', 'wgpu', '--target', process.env.BUILD_TARGET, '--timings'],
            { stdio: 'inherit' });
          const result = await new Promise(resolve => {
            child.once('error', error => resolve({ code: 1, error: error.message }));
            child.once('exit', (code, signal) => resolve({ code: code ?? 1, signal }));
          });
          clearInterval(timer);
          snapshot();
          const summary = {
            ...result, target: process.env.BUILD_TARGET, jobs: process.env.CARGO_BUILD_JOBS,
            totalBytes: os.totalmem(), minimumFreeBytes: minimumFree,
            minimumAvailableBytes: process.platform === 'linux' ? minimumAvailable : null,
            seconds: (Date.now() - started) / 1000, samples,
            scope: 'Whole host sampled every 2 seconds; not exact process peak RSS'
          };
          fs.writeFileSync(`${dir}/summary.json`, JSON.stringify(summary, null, 2));
          console.log(summary);
          process.exitCode = result.code;
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: measurements-${{ matrix.id }}
          path: target/ci-memory/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        with:
          name: timings-${{ matrix.id }}
          path: target/cargo-timings/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
        if: ${{ !cancelled() }}
      - name: Verify x64 architecture and archive executable
        run: |-
          test "$(lipo -archs target/x86_64-apple-darwin/release/tacterm)" = x86_64
          shasum -a 256 target/x86_64-apple-darwin/release/tacterm > target/ci-memory/binary.sha256
          tar -czf target/x64-binary.tar.gz -C target/x86_64-apple-darwin/release tacterm
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.id }}
          path: target/x64-binary.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Package and smoke-test natively on Intel
        run: node --input-type=module -e "process.env.GITHUB_SHA='53a72cda097e4275a8df2a7347fee0a5fb322575'; process.argv=['node','packaging/release.mjs','pack','macos-x64']; await import('./packaging/release.mjs');"
        if: matrix.id == 'intel-native'
      - uses: actions/upload-artifact@v4
        with:
          name: package-intel-native
          path: target/release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
        if: matrix.id == 'intel-native'
  cross:
    name: ${{ matrix.id }}
    strategy:
