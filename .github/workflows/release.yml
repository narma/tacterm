name: Tacterm release

on:
  push:
    tags: ['tacterm-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish an existing matching tag after all native builds pass'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tacterm-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'narma/tacterm'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate release source
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Prepare native matrix
        id: release
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: node packaging/release.mjs prepare
      - name: Check release validation
        run: node --test packaging/release.test.mjs

  build:
    name: ${{ matrix.id }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '8'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      TACTERM_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq pkg-config cmake clang libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libxcb1-dev libvulkan1 glslang-tools
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: tacterm-release-${{ matrix.id }}
          cache-all-crates: true
      - name: Build native release
        run: cargo +stable build --locked --release -p rioterm --bin tacterm --features wgpu --target ${{ matrix.target }}
      - name: Remove packaging output restored from the Rust cache
        run: node packaging/release.mjs clean
      - name: Package and smoke-test native executable
        run: node packaging/release.mjs pack ${{ matrix.id }}
      - name: Compile Windows installer from the portable executable
        if: runner.os == 'Windows'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: packaging/windows/tacterm.iss
          # v1.2.9 reads each line as one compiler argument.
          options: |
            /DReleaseVersion=${{ needs.prepare.outputs.version }}
            /DReleaseArch=${{ matrix.arch }}
          install_latest: 'true'
      - name: Smoke-test Windows installer and record its checksum
        if: runner.os == 'Windows'
        run: |
          ./packaging/windows/test-installer.ps1 -Version '${{ needs.prepare.outputs.version }}' -Arch '${{ matrix.arch }}'
          node packaging/release.mjs setup ${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        with:
          name: tacterm-${{ matrix.id }}${{ runner.os == 'Windows' && '-portable' || '' }}
          path: |
            target/release-assets/*.zip
            target/release-assets/*.tar.gz
            target/release-assets/build-*.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: tacterm-${{ matrix.id }}-setup
          path: |
            target/release-assets/*-setup.exe
            target/release-assets/setup-*.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: tacterm-*
          merge-multiple: true
          path: target/release-assets
      - name: Verify complete release and checksums
        run: node packaging/release.mjs assemble
      - name: Publish all platforms together
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packaging/release.mjs publish

  website:
    needs: [prepare, publish]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Refresh download links from the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo narma/tacterm --ref main
