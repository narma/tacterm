name: Verify Node 24 artifact downloads
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  intel:
    name: macos-x64 native validation and packaging
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 9e70a23389028aa1e717862307256c92932c7c02
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@v7
        with:
          name: release-binary-macos-x64
          path: target/macos-x64-transfer
          run-id: 39492753822
          github-token: ${{ github.token }}
      - name: Verify transferred executable
        run: |
          test "$(uname -m)" = x86_64
          mkdir -p target/x86_64-apple-darwin/release
          tar -xzf target/macos-x64-transfer/executable.tar.gz -C target/x86_64-apple-darwin/release
          cd target/x86_64-apple-darwin/release
          shasum -a 256 -c ../../macos-x64-transfer/SHA256SUMS
          test "$(lipo -archs tacterm)" = x86_64
      - name: Package and smoke-test native executable
        run: node --input-type=module -e "process.env.GITHUB_SHA='9e70a23389028aa1e717862307256c92932c7c02'; process.argv=['node','packaging/release.mjs','pack','macos-x64']; await import('./packaging/release.mjs');"
  assembly:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 9e70a23389028aa1e717862307256c92932c7c02
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@v7
        with:
          pattern: tacterm-*
          merge-multiple: true
          path: target/release-assets
          run-id: 39492753822
          github-token: ${{ github.token }}
      - name: Verify complete release and checksums
        run: node --input-type=module -e "process.env.GITHUB_SHA='9e70a23389028aa1e717862307256c92932c7c02'; process.argv=['node','packaging/release.mjs','assemble']; await import('./packaging/release.mjs');"
